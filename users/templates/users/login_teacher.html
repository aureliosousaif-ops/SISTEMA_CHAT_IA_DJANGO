<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Login Professor</title>

    {% load static %}

    <link
        rel="stylesheet"
        href="{% static 'users/css/style.css' %}"
    >

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>👨‍🏫 Login Professor</h1>

            <p>
                Entre com seus dados
            </p>

            {% if error %}

                <p style="color:red;">

                    {{ error }}

                </p>

            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <input
                    type="text"
                    name="ceap"
                    placeholder="Código CEAP"
                    required
                >

                <br><br>

                <input
                    type="date"
                    name="birth_date"
                    required
                >

                <br><br>

                <button type="submit">

                    Entrar

                </button>

            </form>

        </div>

    </div>

</body>

</html>
